*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#startScreen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:white;text-align:center;background:linear-gradient(#2398d8,#73d5ff 60%,#e0f8ff);pointer-events:auto;touch-action:manipulation}#startScreen h1{font-size:clamp(34px,9vw,64px);margin:0;text-shadow:0 5px 0 #2471a3,0 8px 12px #246}#startScreen p{margin:0 20px;font-size:16px;color:#103c58;line-height:1.7}#playButton{position:relative;z-index:1002;pointer-events:auto;touch-action:manipulation;border:0;border-radius:18px;padding:18px 48px;background:#20c65a;color:white;font-weight:bold;font-size:27px;box-shadow:0 7px 0 #13813a;cursor:pointer}#playButton:active{transform:translateY(4px);box-shadow:0 3px 0 #13813a}
#hud{position:fixed;z-index:20;top:12px;left:12px;color:white;font-weight:bold;font-size:16px;text-shadow:0 2px 4px black;pointer-events:none;display:none;line-height:1.8}#message{position:fixed;z-index:25;top:25%;left:50%;transform:translateX(-50%);color:white;font-size:24px;font-weight:bold;text-align:center;text-shadow:0 3px 6px black;pointer-events:none;white-space:nowrap}#controls{position:fixed;z-index:50;inset:0;display:none;pointer-events:none}#joystickBase{position:absolute;left:22px;bottom:25px;width:245px;height:245px;border-radius:50%;background:rgba(20,35,55,.35);border:3px solid rgba(255,255,255,.7);pointer-events:auto;touch-action:none}#joystickKnob{position:absolute;left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.85);border:3px solid #47718e;pointer-events:none}.actionButton{position:absolute;right:28px;width:145px;height:145px;border-radius:50%;border:3px solid white;color:white;font-size:16px;font-weight:bold;text-shadow:0 1px 3px #333;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:auto;touch-action:none}#jumpButton{bottom:35px;background:rgba(20,150,255,.85);font-size:25px;border-width:4px}#dashButton{top:72px;right:14px;bottom:auto;width:112px;height:48px;border-radius:14px;background:rgba(255,145,20,.95);font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.28)}#restartButton{position:fixed;z-index:100;top:12px;right:124px;display:none;border:0;border-radius:10px;padding:10px 14px;color:white;background:#e34b4b;font-size:15px;font-weight:bold;pointer-events:auto;touch-action:manipulation}#bigScreenButton{position:fixed;z-index:110;top:12px;right:12px;display:none;border:2px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 13px;background:rgba(24,47,72,.86);color:#fff;font-size:14px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:auto;touch-action:manipulation}#finishScreen{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.72);color:white;text-align:center}#finishScreen h2{font-size:38px;margin:0}#finishScreen button{border:0;border-radius:12px;padding:14px 30px;background:#20c65a;color:white;font-size:20px;font-weight:bold;pointer-events:auto;touch-action:manipulation}@media(max-width:380px){#joystickBase{width:205px;height:205px;left:10px;bottom:14px}#joystickKnob{width:88px;height:88px}.actionButton{width:125px;height:125px;right:14px}#jumpButton{bottom:20px;font-size:22px}#dashButton{top:72px;bottom:auto;width:104px;height:46px;right:12px}#restartButton{right:116px;padding:10px 9px;font-size:13px}#bigScreenButton{right:10px;padding:10px 9px;font-size:13px}}

/* Large, minimal mobile controls */
#joystickBase{width:min(60vw,300px);height:min(60vw,300px);left:2vw;bottom:2vh;background:transparent;border:0;outline:0;box-shadow:none;}
#joystickKnob{width:min(30vw,150px);height:min(30vw,150px);background:rgba(255,255,255,.9);border:3px solid rgba(55,95,125,.95);box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .14s ease;}
#joystickBase.joystick-active #joystickKnob{opacity:1;}
.actionButton{width:min(46vw,230px);height:min(46vw,230px);right:2vw;font-size:clamp(18px,4.5vw,26px);}
#jumpButton{bottom:2vh;font-size:clamp(24px,5.5vw,34px);border-width:4px;}
#dashButton{top:clamp(82px,13vh,120px);right:2vw;width:clamp(112px,26vw,145px);height:clamp(50px,10vw,62px);font-size:clamp(14px,3.5vw,18px);border-radius:14px;}
#bigScreenButton{top:12px;right:12px;padding:clamp(12px,3vw,18px) clamp(14px,3.5vw,22px);font-size:clamp(16px,4vw,21px);border-width:2px;border-radius:13px;min-height:50px;}
@media(max-width:380px){#joystickBase{width:60vw;height:60vw;left:1vw;bottom:1vh}#joystickKnob{width:30vw;height:30vw}.actionButton{width:46vw;height:46vw;right:1vw}#jumpButton{bottom:1vh;font-size:24px}#dashButton{top:clamp(82px,13vh,112px);right:1vw;width:29vw;height:50px}#bigScreenButton{right:8px;padding:11px 13px;font-size:16px;min-height:46px}}

#multiplayerPanel{width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px;border:1px solid rgba(255,255,255,.7);border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(5px);color:#103c58}
#multiplayerPanel strong{font-size:18px}#mpActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}#multiplayerPanel button{border:0;border-radius:10px;padding:10px 13px;background:#1769aa;color:#fff;font-weight:bold;font-size:14px;touch-action:manipulation}#roomCodeInput{width:min(52vw,230px);min-width:120px;padding:10px;border:2px solid #1769aa;border-radius:10px;font-size:16px;text-transform:uppercase}#mpStatus{font-size:13px;line-height:1.4;overflow-wrap:anywhere;max-width:95%}#roomInfo{display:none;overflow-wrap:anywhere;font-weight:bold;background:rgba(255,255,255,.75);padding:7px 10px;border-radius:8px;max-width:95%}
@media(max-height:740px){#startScreen{gap:9px;overflow-y:auto;justify-content:flex-start;padding:14px 0}#startScreen h1{font-size:clamp(30px,7vw,48px)}#multiplayerPanel{padding:8px 10px;gap:6px}#startScreen p{font-size:14px}}
</style>

<body>
<div id="startScreen"><h1>3D OBBY</h1><p>全108エリア・超ロングコースに挑戦！<br>大量の足場・溶岩・回転ハンマー・移動足場を突破しよう。</p><div id="multiplayerPanel"><strong>🌐 オンラインマルチプレイ</strong><div id="mpActions"><button id="createRoomBtn" type="button">部屋を作る</button><input id="roomCodeInput" type="text" maxlength="5" autocomplete="off" placeholder="5文字コード"><button id="joinRoomBtn" type="button">参加する</button></div><div id="roomInfo"></div><div id="mpStatus">部屋を作ってコードを友達に送るか、友達のコードを入力してね。</div></div><button id="playButton" type="button">▶ PLAY開始</button><p>左のパッド：移動<br>右のボタン：ジャンプ・ダッシュ<br>画面をスワイプ：カメラ回転</p></div>
<div id="hud">🪙 コイン：<span id="coinCount">0</span><br>🏁 チェックポイント：<span id="checkpointCount">0</span></div><div id="message"></div>
<div id="controls"><div id="joystickBase"><div id="joystickKnob"></div></div><button class="actionButton" id="jumpButton" type="button">JUMP</button><button class="actionButton" id="dashButton" type="button">DASH</button></div>
<button id="restartButton" type="button">↻ リスタート</button><button id="bigScreenButton" type="button" aria-label="大画面表示">⛶ 大画面</button><div id="finishScreen"><h2>🎉 GOAL!!</h2><div id="finishText">ステージクリア！</div><button id="playAgainButton" type="button">もう一度遊ぶ</button></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let scene,camera,renderer,player,clock,charParts=null,characterAnimTime=0;let gameStarted=false,gameFinished=false;let coins=[],platforms=[],hazards=[],checkpoints=[],movingObjects=[];let coinCount=0,checkpointCount=0,currentCheckpoint=new THREE.Vector3(0,1.5,4);let velocityY=0,grounded=false,canJump=true,dashEnabled=false;let rotatingObjects=[],bouncePads=[];let moveX=0,moveY=0,joystickPointer=null,cameraYaw=0,cameraPitch=.32,cameraDragging=false,cameraPointer=null,lastPointerX=0,lastPointerY=0;let multiplayerPeer=null,multiplayerConnections=[],remotePlayers=new Map(),multiplayerLastSend=0,multiplayerName='Player';const GRAVITY=22,JUMP_POWER=9.5,PLAYER_RADIUS=.34,PLAYER_DEPTH=.27,PLAYER_HEIGHT=2.05;
function mat(color,extra={}){return new THREE.MeshStandardMaterial({color,roughness:.78,...extra})}
function addBox(x,y,z,w,h,d,color,opt={}){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,opt.material||{}));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);if(opt.platform)platforms.push({mesh,x1:x-w/2,x2:x+w/2,y1:y-h/2,y2:y+h/2,z1:z-d/2,z2:z+d/2});if(opt.hazard)hazards.push(mesh);if(opt.moving)movingObjects.push({mesh,baseX:x,baseY:y,baseZ:z,phase:Math.random()*Math.PI*2,range:opt.range||2,speed:opt.speed||1.5,axis:opt.axis||'x'});return mesh}
function addCoin(x,y,z){const mesh=new THREE.Mesh(new THREE.TorusGeometry(.34,.11,10,22),new THREE.MeshStandardMaterial({color:0xffd72f,metalness:.75,roughness:.25,emissive:0x6b4500}));mesh.position.set(x,y,z);mesh.rotation.x=Math.PI/2;mesh.castShadow=true;scene.add(mesh);coins.push({mesh,collected:false})}
function addCheckpoint(x,y,z,index){addBox(x,y+.12,z,1.7,.24,1.7,0x28d5a0,{platform:true});const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.2,8),mat(0xffffff));pole.position.set(x,y+1.3,z);scene.add(pole);const flag=new THREE.Mesh(new THREE.BoxGeometry(.8,.45,.06),mat(0x16bfff,{emissive:0x064466}));flag.position.set(x+.38,y+1.9,z);scene.add(flag);checkpoints.push({x,y,z,index,pole,flag,activated:false})}
function buildWorld(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,800,5200);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,5600);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x668099,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-15,30,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x7acb64));ground.rotation.x=-Math.PI/2;ground.position.y=-5;ground.receiveShadow=true;scene.add(ground);buildPlatforms();buildDecorations();buildPlayer();clock=new THREE.Clock()}
function buildPlatforms(){
// STAGE 1：ウォームアップ
addBox(0,0,4,12,1,12,0x37b957,{platform:true});addBox(0,0,-6,5,1,5,0x42c5f5,{platform:true});addBox(4,.8,-12,4,1,4,0xffbd35,{platform:true});addBox(-1,1.5,-18,4,1,4,0xb080ff,{platform:true});
// STAGE 2：溶岩ジャンプ
addBox(0,-1,-25,22,1,13,0xff542e,{hazard:true});addBox(-1,1.4,-23,3.5,1,3.5,0x49c9f5,{platform:true});addBox(4,1.9,-27,3.5,1,3.5,0x49c9f5,{platform:true});addBox(-1,2.4,-31,3.5,1,3.5,0x49c9f5,{platform:true});addBox(-1,2.8,-37,7,1,7,0x41c86c,{platform:true});addCheckpoint(-1,3.3,-37,1);
// STAGE 3：動く障害物と細い道
addBox(5,3.4,-44,4,1,4,0xffd34e,{platform:true});addBox(5,4.3,-48,1,2.4,1,0xff3f65,{hazard:true,moving:true,axis:'x',range:2.6,speed:1.8});addBox(0,4,-52,4,1,4,0x50b7ff,{platform:true});addBox(-4,4.7,-58,4,1,4,0xffbf35,{platform:true});addBox(-4,5,-65,2,.7,11,0x9e7b58,{platform:true});addBox(-4,5.5,-73,4,1,4,0x9e7cff,{platform:true});addBox(1,6.3,-79,4,1,4,0x49c9f5,{platform:true});addBox(5,7.1,-85,7,1,7,0x28c66f,{platform:true});
// STAGE 4：バネ床・回転レーザー・移動足場
addBox(0,7.8,-94,4,1,4,0x42c5f5,{platform:true});addBox(-5,8.5,-101,4,1,4,0xffbd35,{platform:true});addBox(-5,8.5,-107,2.2,.7,8,0x9e7b58,{platform:true});addBox(-5,9,-113,4,1,4,0x55d7a5,{platform:true});addBox(0,9.7,-119,4,1,4,0xb080ff,{platform:true});addBox(5,10.4,-125,8,1,8,0x28c66f,{platform:true});
const spring=addBox(0,8.34,-94,1.45,.12,1.45,0xff4fa3);spring.userData.isSpring=true;spring.userData.top=8.4;bouncePads.push(spring);
const spinner=addBox(-5,9.65,-107,5.5,.22,.45,0xff3f65,{hazard:true});rotatingObjects.push({mesh:spinner,speed:1.9,phase:0});
const movingPlatform=addBox(-1.5,9,-113,2.8,.55,2.8,0x49c9f5,{platform:true,moving:true,axis:'x',range:2.2,speed:1.15});const mpRecord=movingObjects.find(o=>o.mesh===movingPlatform);if(mpRecord){mpRecord.range=2.2;mpRecord.speed=1.15;mpRecord.axis='x';mpRecord.baseX=-1.5;}
// STAGE 5：ネオン階段
const course=[
[0,11,-132,3.5,3.5,0x42c5f5],[-5,11.6,-139,3.5,3.5,0xffbd35],[-5,11.6,-145,2,.7,8,0x9e7b58],[0,12.2,-152,3.5,3.5,0xb080ff],[5,12.8,-159,3.5,3.5,0x49c9f5],[5,13.2,-165,2,.7,7,0x9e7b58],[0,13.8,-172,3.5,3.5,0xffbd35],[-5,14.4,-179,3.5,3.5,0x55d7a5],[-5,14.4,-185,2,.7,7,0x9e7b58],[0,15,-192,4,4,0x28c66f]
];
for(const a of course){if(a.length===7)addBox(a[0],a[1],a[2],a[3],a[4],a[5],a[6],{platform:true});else addBox(a[0],a[1],a[2],a[3],1,a[4],a[5],{platform:true});}
addCheckpoint(0,15.5,-192,2);
// STAGE 6：回転ハンマーと横移動する危険ブロック
addBox(5,15.7,-199,3.5,1,3.5,0xffbd35,{platform:true});
const hammer1=addBox(5,17,-202,5,.28,.45,0xff3155,{hazard:true});rotatingObjects.push({mesh:hammer1,speed:-2.4,phase:1});
const moveHaz1=addBox(0,16.4,-206,1.2,2.4,1.2,0xff3155,{hazard:true,moving:true,axis:'x',range:2.8,speed:2.1});
addBox(0,16,-210,3.5,1,3.5,0x49c9f5,{platform:true});addBox(-5,16.7,-217,3.5,1,3.5,0xb080ff,{platform:true});
const spinner2=addBox(-5,17.5,-217,4.8,.22,.4,0xff3155,{hazard:true});rotatingObjects.push({mesh:spinner2,speed:2.8,phase:0});
addBox(0,17.4,-224,3.5,1,3.5,0xffbd35,{platform:true});addBox(5,18.1,-231,3.5,1,3.5,0x55d7a5,{platform:true});
// STAGE 7：バネ連鎖と小島
const spring2=addBox(5,18.72,-231,1.3,.12,1.3,0xff4fa3);spring2.userData.isSpring=true;spring2.userData.top=18.78;bouncePads.push(spring2);
addBox(0,19.1,-238,3.2,1,3.2,0x42c5f5,{platform:true});addBox(-5,19.8,-245,3.2,1,3.2,0xffbd35,{platform:true});addBox(-5,19.8,-251,2,.7,7,0x9e7b58,{platform:true});
addCheckpoint(-5,20.3,-251,3);
// STAGE 8：消えそうな見た目の足場＋高速移動足場（足場自体は安全）
addBox(0,20.5,-258,3.2,1,3.2,0xb080ff,{platform:true,material:{emissive:0x251044}});
const mover2=addBox(4,21.1,-264,3, .65,3,0x29d9ff,{platform:true,moving:true,axis:'x',range:3,speed:1.45});const mover2Rec=movingObjects.find(o=>o.mesh===mover2);if(mover2Rec){mover2Rec.range=3;mover2Rec.speed=1.45;mover2Rec.baseX=4;}
addBox(0,21.8,-270,3.5,1,3.5,0x55d7a5,{platform:true});addBox(-4,22.5,-276,3.5,1,3.5,0xffbd35,{platform:true});
const hammer2=addBox(-4,23.6,-279,5,.25,.45,0xff3155,{hazard:true});rotatingObjects.push({mesh:hammer2,speed:-3.1,phase:2});
addBox(0,23.2,-283,3.5,1,3.5,0x49c9f5,{platform:true});addBox(4,23.9,-290,4,1,4,0x28c66f,{platform:true});
addCheckpoint(4,24.4,-290,4);
// 既存8エリアの先に、さらに100エリアを自動生成
addBox(0,27.4,-328,5,1,5,0x28c66f,{platform:true});
let generatedCheckpointIndex=4;
const palette=[0x42c5f5,0xffbd35,0xb080ff,0x55d7a5,0xff7f50,0x48a9ff,0xf06acb,0x28c66f];
let prevX=0, prevY=27.4, prevZ=-328;
for(let stage=9;stage<=108;stage++){
  // 各エリアに8枚ずつ、計800枚の足場。横位置と高さを変えて飽きにくくする。
  for(let j=0;j<8;j++){
    const idx=(stage-9)*8+j;
    const lanePattern=[-4,0,4,0,-4,0,4,0];
    let x=lanePattern[idx%lanePattern.length];
    const z=prevZ-5.15;
    const y=27.4+Math.sin(idx*.115)*1.7 + Math.sin(idx*.037)*.65;
    const color=palette[(stage+j)%palette.length];
    const narrow=(stage%6===0 && j%3===1);
    const w=narrow?1.65:(stage%4===0?2.8:3.25);
    const d=(j===3 && stage%5===0)?5.8:(narrow?2.2:3.15);
    const platform=addBox(x,y,z,w,.8,d,color,{platform:true,moving:(j===3 && stage%10===0),axis:'x',range:1.45,speed:1.0+(stage%4)*.12,material:stage%8===0?{emissive:0x172030}:{}});platform.castShadow=false;platform.receiveShadow=false;
    // ところどころに動く足場・回転バー・バネ床を追加
    if(j===3 && stage%10===0){
      const rec=movingObjects.find(o=>o.mesh===platform); if(rec){rec.axis='x';rec.range=1.45;rec.speed=1.0+(stage%4)*.12;rec.baseX=x;}
    }
    if(j===5 && stage%7===0){
      const bar=addBox(x,y+.9,z,3.5,.18,.38,0xff3155,{hazard:true});
      rotatingObjects.push({mesh:bar,speed:(stage%2?1:-1)*(1.3+(stage%4)*.25),phase:stage*.3});
    }
    if(j===2 && stage%9===0){
      const pad=addBox(x,y+.47,z,1.15,.12,1.15,0xff4fa3);
      pad.userData.isSpring=true;pad.userData.top=y+.53;bouncePads.push(pad);
    }
    if(j===1 || j===5) addCoin(x,y+1.25,z);
    prevX=x;prevY=y;prevZ=z;
  }
  if(stage%5===0){
    generatedCheckpointIndex++;
    addCheckpoint(prevX,prevY+.5,prevZ,generatedCheckpointIndex);
  }
  if(stage%10===0){
    const stageSign=makeTextSign('STAGE '+stage,prevX,prevY+2.5,prevZ,0x1769aa);scene.add(stageSign);
  }
}
// 最終ゴールは100エリアの先に配置
const goalX=prevX, goalY=prevY, goalZ=prevZ-6;
addBox(goalX,goalY,goalZ,9,1,9,0x28c66f,{platform:true});
addBox(goalX-3.5,goalY+1.8,goalZ,.5,3.6,.5,0xffffff);addBox(goalX+3.5,goalY+1.8,goalZ,.5,3.6,.5,0xffffff);addBox(goalX,goalY+3.6,goalZ,7.5,.5,.5,0xffdf35);
const sign=makeTextSign('ULTIMATE GOAL!',goalX,goalY+4.2,goalZ,0x28c66f);scene.add(sign);
window.obbyGoal={x:goalX,y:goalY,z:goalZ};
// ステージ名の看板
for(const s of [['STAGE 5',0,14,-192],['STAGE 6',0,17,-224],['STAGE 7',0,20,-251],['STAGE 8',0,22,-290]])scene.add(makeTextSign(s[0],s[1],s[2]+2,s[3],0x1769aa));

function makeTextSign(text,x,y,z,color){const c=document.createElement('canvas');c.width=512;c.height=160;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,512,160);ctx.fillStyle='#'+color.toString(16).padStart(6,'0');ctx.font='bold 90px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,80);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(4,1.25),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,side:THREE.DoubleSide}));mesh.position.set(x,y,z);return mesh}
function buildDecorations(){for(let i=0;i<22;i++){const z=4-i*4.2,side=i%2===0?-1:1,x=side*(10+Math.random()*7),h=2+Math.random()*4;addBox(x,h/2-1,z,1.5,h,1.5,[0x49a9ed,0x9b82e6,0xf0c14b,0x56cba1][i%4]);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2,7),mat(0x795334));trunk.position.set(x+side*2,0,z);scene.add(trunk);const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.8,7),mat(0x1eae68));leaves.position.set(x+side*2,1.9,z);scene.add(leaves)}for(let i=0;i<50;i++){const group=new THREE.Group(),x=(Math.random()-.5)*100,y=13+Math.random()*28,z=-Math.random()*4700;for(let j=0;j<4;j++){const part=new THREE.Mesh(new THREE.SphereGeometry(1.3+Math.random(),12,10),mat(0xffffff));part.position.set(j*1.4,Math.random()*.5,0);group.add(part)}group.position.set(x,y,z);scene.add(group)}}
function buildPlayer(){
 player=new THREE.Group();charParts={arms:[],legs:[],head:null,torso:null};
 const skin=mat(0xf2bd91),shirt=mat(0x1878ed),shirtLight=mat(0x55c1ff),pants=mat(0x263957),shoe=mat(0x202632),dark=mat(0x20202a),white=mat(0xffffff),hair=mat(0x51301f),gold=mat(0xffcf42);
 const part=(geo,material,parent,pos,cast=true)=>{const m=new THREE.Mesh(geo,material);m.position.set(...pos);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m};
 // 体：シャツ、襟、ベルト、胸の模様
 const torso=new THREE.Group();torso.position.y=1.0;player.add(torso);charParts.torso=torso;

 part(new THREE.BoxGeometry(.28,.12,.435),shirtLight,torso,[0,.28,.008]);
 part(new THREE.BoxGeometry(.73,.10,.44),pants,torso,[0,-.36,0]);
 part(new THREE.BoxGeometry(.18,.22,.035),gold,torso,[0,-.35,.23]);
 // 背中の小さな冒険バッグ
 part(new THREE.BoxGeometry(.48,.52,.18),mat(0x8a4b27),torso,[0,.02,-.28]);
 part(new THREE.BoxGeometry(.3,.12,.025),gold,torso,[0,.05,-.385]);
 // 首と頭
 part(new THREE.CylinderGeometry(.13,.13,.18,10),skin,player,[0,1.48,0]);
 const head=new THREE.Group();head.position.set(0,1.78,0);player.add(head);charParts.head=head;
 part(new THREE.BoxGeometry(.68,.64,.62),skin,head,[0,0,0]);
 // 前髪・髪の上部と左右の束
 part(new THREE.BoxGeometry(.72,.18,.67),hair,head,[0,.34,-.015]);
 part(new THREE.BoxGeometry(.22,.22,.22),hair,head,[-.23,.23,.23]);
 part(new THREE.BoxGeometry(.22,.18,.22),hair,head,[.12,.25,.24]);
 part(new THREE.BoxGeometry(.13,.25,.18),hair,head,[.29,.14,-.03]);
 // 目・眉・鼻・笑顔
 for(const ex of [-.16,.16]){part(new THREE.BoxGeometry(.105,.12,.035),white,head,[ex,.035,.318]);part(new THREE.BoxGeometry(.052,.075,.022),dark,head,[ex,.025,.342]);part(new THREE.BoxGeometry(.12,.035,.025),hair,head,[ex,.135,.326]);}
 part(new THREE.BoxGeometry(.07,.07,.055),mat(0xe6a27c),head,[0,-.07,.33]);
 const mouth=part(new THREE.BoxGeometry(.19,.035,.025),mat(0x8c3434),head,[0,-.19,.322]);
 // 腕は肩を中心に回転
 for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.46,1.28,0);player.add(arm);part(new THREE.BoxGeometry(.23,.48,.25),shirt,arm,[0,-.21,0]);part(new THREE.BoxGeometry(.22,.20,.23),skin,arm,[0,-.51,.015]);charParts.arms.push({mesh:arm,side});}
 // 脚と靴は腰から振り子のように動く
 for(const side of [-1,1]){const leg=new THREE.Group();leg.position.set(side*.2,.61,0);player.add(leg);part(new THREE.BoxGeometry(.25,.48,.29),pants,leg,[0,-.22,0]);part(new THREE.BoxGeometry(.29,.16,.4),shoe,leg,[0,-.48,.055]);part(new THREE.BoxGeometry(.24,.035,.30),mat(0x55c1ff),leg,[0,-.42,.075]);charParts.legs.push({mesh:leg,side});}
 player.position.copy(currentCheckpoint);scene.add(player)
}
function animateCharacter(dt,moveAmount){characterAnimTime+=dt;const moving=moveAmount>.08;const swing=moving?Math.sin(characterAnimTime*(dashEnabled?14:10))*.72:0;for(let i=0;i<charParts.legs.length;i++)charParts.legs[i].mesh.rotation.x=moving?swing*(i===0?1:-1):Math.sin(characterAnimTime*2+i)*.025;for(let i=0;i<charParts.arms.length;i++){const a=charParts.arms[i];a.mesh.rotation.x=moving?-swing*(a.side===-1?1:-1):Math.sin(characterAnimTime*2+a.side)*.035;a.mesh.rotation.z=a.side*.04;}charParts.torso.position.y=1+(moving?Math.abs(Math.sin(characterAnimTime*(dashEnabled?14:10)))*.045:Math.sin(characterAnimTime*2)*.018);charParts.head.rotation.y=moving?Math.sin(characterAnimTime*3)*.035:Math.sin(characterAnimTime*.8)*.04;charParts.head.rotation.x=grounded?0:-.08;}
function setMPStatus(text){$('mpStatus').textContent=text}
function cleanupMultiplayer(){for(const c of multiplayerConnections){try{c.close()}catch(e){}}multiplayerConnections=[];for(const [id,r] of remotePlayers){scene.remove(r.avatar);remotePlayers.delete(id)}if(multiplayerPeer){try{multiplayerPeer.destroy()}catch(e){}multiplayerPeer=null}}
function makeRemotePlayer(id){if(remotePlayers.has(id)||!player||!scene)return;const avatar=player.clone(true);avatar.position.copy(player.position);avatar.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(avatar);remotePlayers.set(id,{avatar,target:new THREE.Vector3().copy(player.position),targetYaw:player.rotation.y,lastSeen:performance.now()})}
function removeRemotePlayer(id){const r=remotePlayers.get(id);if(r){scene.remove(r.avatar);remotePlayers.delete(id)}}
function setupPeerConnection(conn){if(multiplayerConnections.includes(conn))return;multiplayerConnections.push(conn);conn.on('open',()=>{setMPStatus('接続しました！ PLAY開始で一緒に遊べます。参加人数：'+multiplayerConnections.filter(c=>c.open).length);});conn.on('data',data=>{if(!data||data.type!=='state'||!Array.isArray(data.position))return;makeRemotePlayer(conn.peer);const r=remotePlayers.get(conn.peer);if(!r)return;r.target.set(Number(data.position[0])||0,Number(data.position[1])||0,Number(data.position[2])||0);r.targetYaw=Number(data.rotation)||0;r.lastSeen=performance.now();if(data.name)r.name=data.name;});conn.on('close',()=>{removeRemotePlayer(conn.peer);multiplayerConnections=multiplayerConnections.filter(c=>c!==conn);setMPStatus('相手が退出しました。接続中：'+multiplayerConnections.filter(c=>c.open).length)});conn.on('error',err=>{console.warn('Multiplayer connection error',err);setMPStatus('通信エラー。部屋コードを確認して、もう一度試してね。')})}
function initPeer(peerId=null){if(!window.Peer){setMPStatus('通信ライブラリを読み込めません。インターネット接続を確認して再読み込みしてね。');return null}cleanupMultiplayer();try{multiplayerPeer=peerId?new Peer(peerId):new Peer();multiplayerPeer.on('error',err=>{console.warn('Peer error',err);if(err&&err.type==='unavailable-id'){setMPStatus('その部屋コードは使用中です。もう一度「部屋を作る」を押してね。')}else{setMPStatus('接続エラー：HTTPS対応のサイトで開き、コードを確認してもう一度試してね。')}});multiplayerPeer.on('connection',conn=>setupPeerConnection(conn));return multiplayerPeer}catch(err){setMPStatus('オンライン接続を開始できませんでした。');return null}}
function makeShortRoomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<5;i++)code+=chars[Math.floor(Math.random()*chars.length)];return code}
$('createRoomBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const code=makeShortRoomCode();const peer=initPeer(code);if(!peer)return;setMPStatus('5文字の部屋コードを作成中…');peer.on('open',id=>{$('roomCodeInput').value=code;$('roomInfo').style.display='block';$('roomInfo').textContent='部屋コード：'+code;setMPStatus('この5文字コードを友達に送ってね。友達はコードを入力して「参加する」を押します。');});});
$('joinRoomBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const code=$('roomCodeInput').value.trim().toUpperCase();if(!code){setMPStatus('先に友達から部屋コードをもらって入力してね。');return}if(code.length!==5){setMPStatus('部屋コードは5文字で入力してね。');return}const peer=initPeer();if(!peer)return;setMPStatus('部屋に接続中…');peer.on('open',()=>{const conn=peer.connect(code,{reliable:true});setupPeerConnection(conn);conn.on('open',()=>{ $('roomInfo').style.display='block';$('roomInfo').textContent='参加先：'+code;setMPStatus('部屋に参加しました！ PLAY開始で一緒に遊べます。');});});});
function updateMultiplayer(dt){const now=performance.now();for(const [id,r] of remotePlayers){r.avatar.position.lerp(r.target,Math.min(1,dt*12));let delta=((r.targetYaw-r.avatar.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;r.avatar.rotation.y+=delta*Math.min(1,dt*10);if(now-r.lastSeen>15000)removeRemotePlayer(id)}if(now-multiplayerLastSend<90||!player)return;multiplayerLastSend=now;const packet={type:'state',position:[player.position.x,player.position.y,player.position.z],rotation:player.rotation.y,name:multiplayerName,dash:dashEnabled};for(const conn of multiplayerConnections){if(conn.open){try{conn.send(packet)}catch(e){}}}}
function showMessage(t){$('message').textContent=t;$('message').style.opacity='1';clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>$('message').style.opacity='0',1600)}function updateHUD(){$('coinCount').textContent=coinCount;$('checkpointCount').textContent=checkpointCount}
function resetPlayer(){player.position.copy(currentCheckpoint);velocityY=0;grounded=false;canJump=true;dashTimer=0;showMessage('チェックポイントに戻った！')}
function activateCheckpoint(cp){if(cp.activated)return;cp.activated=true;currentCheckpoint.set(cp.x,cp.y+.25,cp.z);checkpointCount=cp.index;cp.flag.material.color.set(0xffdf35);showMessage('✅ チェックポイント！');updateHUD()}
function playerBoxAt(x,y,z){return {minX:x-PLAYER_RADIUS,maxX:x+PLAYER_RADIUS,minY:y,maxY:y+PLAYER_HEIGHT,minZ:z-PLAYER_DEPTH,maxZ:z+PLAYER_DEPTH}}
function overlaps(a,b){return a.maxX>b.x1+1e-5&&a.minX<b.x2-1e-5&&a.maxY>b.y1+1e-5&&a.minY<b.y2-1e-5&&a.maxZ>b.z1+1e-5&&a.minZ<b.z2-1e-5}
function platformCollision(x,y,z){const b=playerBoxAt(x,y,z);return platforms.some(p=>overlaps(b,p))}
// 軸ごとに小刻みに移動。床・側面・天井をプレイヤー全身の箱で衝突判定する。
function moveWithCollision(dx,dy,dz){const distance=Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz));const steps=Math.max(1,Math.ceil(distance/.12));const sx=dx/steps,sy=dy/steps,sz=dz/steps;for(let i=0;i<steps;i++){if(sx){const nx=player.position.x+sx;if(!platformCollision(nx,player.position.y,player.position.z))player.position.x=nx}if(sz){const nz=player.position.z+sz;if(!platformCollision(player.position.x,player.position.y,nz))player.position.z=nz}if(sy){const oldY=player.position.y,ny=oldY+sy;let blocked=false;if(platformCollision(player.position.x,ny,player.position.z)){blocked=true;if(sy<0){let top=-Infinity;for(const p of platforms){const b=playerBoxAt(player.position.x,ny,player.position.z);if(b.maxX>p.x1&&b.minX<p.x2&&b.maxZ>p.z1&&b.minZ<p.z2&&oldY>=p.y2-.2&&ny<=p.y2+.02)top=Math.max(top,p.y2)}if(top>-Infinity){player.position.y=top;velocityY=0;grounded=true;canJump=true}else{player.position.y=oldY;velocityY=0}}else{player.position.y=oldY;velocityY=0}}else player.position.y=ny;if(!blocked&&sy<0){const b=playerBoxAt(player.position.x,player.position.y,player.position.z);for(const p of platforms){if(b.maxX>p.x1&&b.minX<p.x2&&b.maxZ>p.z1&&b.minZ<p.z2&&Math.abs(b.minY-p.y2)<.025){player.position.y=p.y2;velocityY=0;grounded=true;canJump=true;break}}}}}}
function checkHazards(){const b=playerBoxAt(player.position.x,player.position.y,player.position.z);for(const h of hazards){const hb=new THREE.Box3().setFromObject(h);if(b.maxX>hb.min.x&&b.minX<hb.max.x&&b.maxY>hb.min.y&&b.minY<hb.max.y&&b.maxZ>hb.min.z&&b.minZ<hb.max.z){resetPlayer();return}}if(player.position.y < -12)resetPlayer()}
function updatePhysics(dt){const forward=new THREE.Vector3(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw)),right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw)),dir=new THREE.Vector3().addScaledVector(forward,-moveY).addScaledVector(right,moveX);if(dir.lengthSq()>1)dir.normalize();let speed=dashEnabled?12.5:7;const dx=dir.x*speed*dt,dz=dir.z*speed*dt;grounded=false;velocityY-=GRAVITY*dt;const dy=velocityY*dt;moveWithCollision(dx,dy,dz);if(dir.lengthSq()>.01)player.rotation.y=Math.atan2(dir.x,dir.z);animateCharacter(dt,dir.length());for(const coin of coins){if(coin.collected)continue;coin.mesh.rotation.z+=dt*2.5;if(player.position.distanceTo(coin.mesh.position)<1.4){coin.collected=true;scene.remove(coin.mesh);coinCount++;updateHUD();showMessage('🪙 コイン +1')}}for(const cp of checkpoints){const d=Math.hypot(player.position.x-cp.x,player.position.z-cp.z);if(d<2.2&&Math.abs(player.position.y-cp.y)<3)activateCheckpoint(cp)}const time=performance.now()*.001;for(const o of movingObjects){const off=Math.sin(time*o.speed+o.phase)*o.range;o.mesh.position[o.axis==='x'?'x':o.axis==='y'?'y':'z']=o['base'+o.axis.toUpperCase()]+off;const p=platforms.find(p=>p.mesh===o.mesh);if(p){p.x1=o.mesh.position.x-o.mesh.geometry.parameters.width/2;p.x2=o.mesh.position.x+o.mesh.geometry.parameters.width/2;p.z1=o.mesh.position.z-o.mesh.geometry.parameters.depth/2;p.z2=o.mesh.position.z+o.mesh.geometry.parameters.depth/2;p.y1=o.mesh.position.y-o.mesh.geometry.parameters.height/2;p.y2=o.mesh.position.y+o.mesh.geometry.parameters.height/2}}
for(const r of rotatingObjects)r.mesh.rotation.y=time*r.speed;
// Spring pads bounce the whole character when the feet touch the pad from above
for(const pad of bouncePads){const b=playerBoxAt(player.position.x,player.position.y,player.position.z),pb=new THREE.Box3().setFromObject(pad);if(b.maxX>pb.min.x&&b.minX<pb.max.x&&b.maxZ>pb.min.z&&b.minZ<pb.max.z&&Math.abs(b.minY-pad.userData.top)<.18&&velocityY<=0){velocityY=15;grounded=false;canJump=false;showMessage('🌸 バネジャンプ！')}}
checkHazards();if(window.obbyGoal&&player.position.z<window.obbyGoal.z+1&&Math.abs(player.position.x-window.obbyGoal.x)<5&&player.position.y>window.obbyGoal.y-1)finishGame()}
function updateCamera(dt){const dist=8.5,target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z),horizontal=Math.cos(cameraPitch)*dist,desired=new THREE.Vector3(target.x+Math.sin(cameraYaw)*horizontal,target.y+Math.sin(cameraPitch)*dist+2,target.z+Math.cos(cameraYaw)*horizontal);camera.position.lerp(desired,Math.min(1,dt*6));camera.lookAt(target)}function finishGame(){if(gameFinished)return;gameFinished=true;$('finishScreen').style.display='flex';$('finishText').textContent='集めたコイン：'+coinCount+' 枚'}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock?clock.getDelta():.016,.035);if(gameStarted&&!gameFinished&&player){updatePhysics(dt);updateCamera(dt);updateMultiplayer(dt)}else if(player){updateMultiplayer(dt)}if(renderer&&scene&&camera)renderer.render(scene,camera)}function startGame(){if(gameStarted)return;gameStarted=true;gameFinished=false;$('startScreen').style.display='none';$('controls').style.display='block';$('hud').style.display='block';$('restartButton').style.display='block';$('bigScreenButton').style.display='block';showMessage(remotePlayers.size?'友達と一緒にゴールを目指そう！':'ゴールを目指そう！');clock.start()}

$('jumpButton').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(gameStarted&&!gameFinished&&(grounded||canJump)){velocityY=JUMP_POWER;grounded=false;canJump=false}});$('dashButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!gameStarted||gameFinished)return;dashEnabled=!dashEnabled;$('dashButton').textContent=dashEnabled?'DASH: ON':'DASH: OFF';$('dashButton').style.background=dashEnabled?'rgba(30,190,90,.96)':'rgba(255,145,20,.95)';showMessage(dashEnabled?'ダッシュ ON':'ダッシュ OFF')});
function isControl(t){return !!t.closest('#controls,#startScreen,#finishScreen,#restartButton,#bigScreenButton')}document.addEventListener('pointerdown',e=>{if(!gameStarted||gameFinished||isControl(e.target))return;cameraDragging=true;cameraPointer=e.pointerId;lastPointerX=e.clientX;lastPointerY=e.clientY});document.addEventListener('pointermove',e=>{if(!cameraDragging||e.pointerId!==cameraPointer)return;cameraYaw-=(e.clientX-lastPointerX)*.006;cameraPitch+=(e.clientY-lastPointerY)*.004;lastPointerX=e.clientX;lastPointerY=e.clientY});function stopDrag(e){if(e.pointerId===cameraPointer){cameraDragging=false;cameraPointer=null}}document.addEventListener('pointerup',stopDrag);document.addEventListener('pointercancel',stopDrag);
$('bigScreenButton').addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();try{if(!document.fullscreenElement){const root=document.documentElement;if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();}else{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}}catch(err){showMessage('このブラウザでは大画面表示を開始できません');} });
function syncBigScreenLabel(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);$('bigScreenButton').textContent=active?'⛶ 通常表示':'⛶ 大画面';}document.addEventListener('fullscreenchange',syncBigScreenLabel);document.addEventListener('webkitfullscreenchange',syncBigScreenLabel);
function restartGame(){player.position.copy(new THREE.Vector3(0,1.5,4));currentCheckpoint.set(0,1.5,4);velocityY=0;grounded=false;canJump=true;dashEnabled=false;$('dashButton').textContent='DASH: OFF';$('dashButton').style.background='rgba(255,145,20,.95)';coinCount=0;checkpointCount=0;gameFinished=false;for(const c of coins){c.collected=false;scene.add(c.mesh)}for(const cp of checkpoints){cp.activated=false;cp.flag.material.color.set(0x16bfff)}updateHUD();$('finishScreen').style.display='none';showMessage('もう一度スタート！')} $('restartButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();restartGame()});$('playAgainButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();restartGame()});window.addEventListener('resize',()=>{if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight)});
try{buildWorld();animate()}catch(err){console.error(err);$('startScreen').innerHTML='<h1>読み込みエラー</h1><p>ゲームの読み込みに失敗しました。<br>インターネット接続を確認してページを再読み込みしてください。</p>'}
